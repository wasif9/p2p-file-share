name: Go Linting CI

on:
  push:
    branches:
      - main
      - release/*
      - 90-Download-chunks-and-Reconstruct-file
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  golangci:
    strategy:
      fail-fast: true
      matrix:
        go: [1.24.1]
        os: [macos-latest, windows-latest]

    name: Run Go Linter
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.0
          args: --timeout=3m
